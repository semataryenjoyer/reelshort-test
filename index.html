<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ShortDrama Test</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  :root { --bg:#0b0b0f; --card:#16161e; --line:#26263a; --txt:#eee; --dim:#8a8aa3; --acc:#ff2d55; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:#0b0b0fee; backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  h1 span { color:var(--acc); }
  input, select, button { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  button { cursor:pointer; }
  button:hover { border-color:var(--acc); }
  main { padding:16px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; transition:.15s; }
  .card:hover { transform:translateY(-3px); border-color:var(--acc); }
  .thumb { aspect-ratio:2/3; background:linear-gradient(160deg,#232338,#12121a); display:grid; place-items:center; font-size:26px; color:#3a3a55; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .meta { padding:8px 9px; }
  .meta b { display:block; font-size:12.5px; font-weight:600; line-height:1.35; height:2.7em; overflow:hidden; }
  .meta small { color:var(--dim); font-size:11px; }
  .badge { display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.7px; padding:2px 6px; border-radius:4px; background:#23233a; color:#9aa; margin-top:4px; }
  .off { display:inline-block; font-size:10.5px; margin-top:5px; color:#9aa; text-decoration:none; border:1px solid var(--line); border-radius:4px; padding:2px 6px; }
  .off:hover { border-color:var(--acc); color:#fff; }
  #view { display:none; }
  #player { width:100%; max-height:70vh; background:#000; border-radius:10px; }
  #eps { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  #eps button { padding:6px 11px; font-size:12.5px; }
  #eps button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  #status { color:var(--dim); font-size:12.5px; margin:10px 0; min-height:18px; }
  #status.err { color:#ff8080; }
  #dbg { background:#101018; border:1px solid var(--line); border-radius:8px; padding:10px; font:11.5px/1.5 ui-monospace,monospace; white-space:pre-wrap; max-height:280px; overflow:auto; display:none; }
  .back { margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <h1>SHORT<span>DRAMA</span></h1>
  <select id="plat">
    <option value="dramabox">DramaBox</option>
    <option value="reelshort">ReelShort</option>
    <option value="dramawave">DramaWave</option>
  </select>
  <input id="q" placeholder="search titles..." />
  <button id="go">Search</button>
  <button id="home">Home</button>
</header>
<main>
  <div id="status"></div>
  <div id="grid"></div>
  <div id="view">
    <button class="back" id="back">← back</button>
    <video id="player" controls playsinline></video>
    <h2 id="vtitle" style="font-size:17px;margin:12px 0 0"></h2>
    <a id="voff" class="off" target="_blank" rel="noopener" style="display:none">Official ↗</a>
    <div id="eps"></div>
    <pre id="dbg"></pre>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const status = (t, err) => { $('#status').textContent = t || ''; $('#status').className = err ? 'err' : ''; };
let hls = null, current = null;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function card(item) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<div class="thumb">${item.cover ? `<img loading="lazy" src="${esc(item.cover)}" alt="" onerror="this.remove()">` : '🎬'}</div>
    <div class="meta"><b>${esc(item.title)}</b><small>${esc(item.platform)}</small>
    ${item.episodes ? `<span class="badge">${item.episodes} EP</span>` : ''}</div>`;
  if (item.official) {
    const a = document.createElement('a');
    a.href = item.official;
    a.target = '_blank';
    a.rel = 'noopener';
    a.className = 'off';
    a.textContent = 'Official ↗';
    a.onclick = (e) => e.stopPropagation();
    d.querySelector('.meta').appendChild(a);
  }
  d.onclick = () => open(item);
  return d;
}

function render(items) {
  $('#grid').innerHTML = '';
  $('#grid').style.display = 'grid';
  $('#view').style.display = 'none';
  if (!items.length) return status('nothing found', true);
  items.forEach((i) => $('#grid').appendChild(card(i)));
  status(`${items.length} series`);
}

async function loadSeed() {
  const r = await fetch('/data/series.json');
  render(await r.json());
}

async function doSearch() {
  const q = $('#q').value.trim();
  if (!q) return loadSeed();
  status('searching...');
  const r = await fetch(`/api/search?platform=${$('#plat').value}&q=${encodeURIComponent(q)}`);
  const j = await r.json();
  if (j.error) return status(j.error, true);
  render((j.results || []).map((x) => ({ ...x, platform: $('#plat').value })));
}

async function open(item) {
  current = item;
  status('loading episodes...');
  $('#grid').style.display = 'none';
  $('#view').style.display = 'block';
  $('#vtitle').textContent = item.title;
  $('#eps').innerHTML = '';
  $('#dbg').style.display = 'none';
  const vo = $('#voff');
  if (item.official) { vo.href = item.official; vo.style.display = 'inline-block'; }
  else vo.style.display = 'none';
  stop();

  const r = await fetch(`/api/detail?platform=${item.platform}&id=${item.id}`);
  const j = await r.json();
  if (j.error) return status(j.error, true);

  const n = j.episodeCount || item.episodes || 0;
  status(`${j.title || item.title} — ${n} episodes`);
  for (let i = 1; i <= n; i++) {
    const b = document.createElement('button');
    b.textContent = i;
    b.onclick = () => play(i, b);
    $('#eps').appendChild(b);
  }
  if (n) $('#eps').firstChild.click();
}

function stop() {
  if (hls) { hls.destroy(); hls = null; }
  const v = $('#player');
  v.pause(); v.removeAttribute('src'); v.load();
}

async function play(ep, btn) {
  [...$('#eps').children].forEach((b) => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  status(`resolving episode ${ep}...`);
  stop();

  const r = await fetch(`/api/play?platform=${current.platform}&id=${current.id}&ep=${ep}`);
  const j = await r.json();

  if (j.error) {
    status(`${j.error} — see debug below`, true);
    const d = await (await fetch(`/api/play?platform=${current.platform}&id=${current.id}&ep=${ep}&debug=1`)).json();
    $('#dbg').textContent = JSON.stringify(d, null, 2);
    $('#dbg').style.display = 'block';
    return;
  }

  status(`episode ${ep} / ${j.total}`);
  const v = $('#player');
  if (j.kind === 'hls' && window.Hls?.isSupported()) {
    hls = new Hls();
    hls.loadSource(j.url);
    hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, e) => { if (e.fatal) status('playback error: ' + e.details, true); });
  } else {
    v.src = j.url;
  }
  v.play().catch(() => {});
}

$('#go').onclick = doSearch;
$('#home').onclick = () => { $('#q').value = ''; loadSeed(); };
$('#q').onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };
$('#back').onclick = () => { stop(); loadSeed(); };
loadSeed();
</script>
</body>
</html>
